{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="Author" content="Denilson Bernardo Da Fonseca" />
    <link rel="stylesheet" href="{% static 'Dyslexia_global.css' %}" />
    <meta name="description" content="E-store" />
    <title></title>
  </head>
  <body>
    {% if messages %} {% for message in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      {{ message }}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {% endfor %} {% endif %}
    <!-- header -->
    <header class="navbar navbar-expand-lg bg-dark px-3 py-3">
      <div
        class="container-fluid d-flex justify-content-between align-items-center flex-wrap"
      >
        <!-- Brand Logo -->
        <a
          class="navbar-brand d-flex align-items-center"
          href="{% url 'main' %}"
        >
          <img
            src="{% static 'site/Dx.png' %}"
            alt="Dyslexia Logo"
            class="img-fluid"
            style="max-height: 60px; width: auto"
          />
        </a>

        <!-- Title -->
        <h1
          class="text-dark text-center mb-0 flex-grow-1 text-nowrap"
          style="font-size: clamp(1rem, 2vw, 2rem)"
        >
          DyslexiaCore
        </h1>

        <!-- Search Icon -->
        <a
          class="d-flex align-items-center justify-content-center"
          href="{% url 'search' %}"
        >
          <img
            src="{% static 'site/seaa.png' %}"
            alt="Search Icon"
            class="img-fluid"
            style="height: 60px; width: auto"
          />
        </a>
      </div>
    </header>
    <script src="{% static 'scripts.js' %}"></script>
  </body>
</html>
