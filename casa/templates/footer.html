{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{% static 'styles.css' %}" rel="stylesheet" />
    <title>DyslexiaCore</title>
  </head>
  <body class="d-flex flex-column min-vh-100">

    <!-- Page Content -->
    <main class="flex-fill">
      <!-- Your page content goes here -->
    </main>

    <!-- Footer -->
    <footer class="mt-auto bg-light py-4">
      <div class="container">
        <div class="row align-items-center text-center text-md-start">
          <!-- About Link -->
          <div class="col-12 col-md-4 mb-3 mb-md-0">
            <a href="/info" class="text-dark text-decoration-underline fw-semibold">
              About Dyslexia
            </a>
          </div>

          <!-- Phone -->
          <div class="col-12 col-md-4 mb-3 mb-md-0 d-flex justify-content-center justify-content-md-start align-items-center">
            <img src="{% static 'site/app.png' %}" alt="Phone Icon" class="me-2" style="width:24px; height:24px;" />
            <span>+264 81 385 8181</span>
          </div>

          <!-- Email -->
          <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-start align-items-center">
            <img src="{% static 'site/email.png' %}" alt="Email Icon" class="me-2" style="width:24px; height:24px;" />
            <span>dyslexiacore@gmail.com</span>
          </div>
        </div>

        <hr class="border-secondary mt-4" />

        <!-- Payment Method -->
        <div class="row">
          <div class="col text-center mb-2">
            <a href="/payment_method" class="text-dark text-decoration-underline fw-semibold">
              Payment Method
            </a>
          </div>
        </div>

        <!-- Copyright -->
        <div class="row">
          <div class="col text-center text-dark">
            © {{ now.year }} DyslexiaCore. All rights reserved.
          </div>
        </div>
      </div>
    </footer>

    <!-- Optional: Add some spacing below footer on mobile -->
    <style>
      @media (max-width: 576px) {
        footer .row > div {
          margin-bottom: 0.5rem;
        }
      }
    </style>

  </body>
</html>
