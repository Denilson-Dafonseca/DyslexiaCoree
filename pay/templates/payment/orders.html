{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Dyslexiacore</title>
    <link rel="stylesheet" href="{% static 'Dyslexia_global.css' %}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f9f9f9;
      }
      .checkout-container {
        max-width: 1000px;
        margin: 40px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }
      .payment-option {
        background-color: #f8f8f8;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        border: 1px solid #ddd;
      }
      .payment-option:hover {
        background-color: #e9ecef;
      }
      .payment-option input {
        margin-right: 10px;
      }
      .btn-checkout {
        width: 100%;
        background: black;
        color: white;
        padding: 12px;
        font-size: 18px;
        border-radius: 10px;
      }
      .cart-summary {
        background-color: #f4f4f4;
        border-radius: 10px;
        padding: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container checkout-container">
      <h2 class="text-center mb-4 fw-bold">Checkout</h2>

      <form method="POST">
        {% csrf_token %}
        <div class="row">
          <!-- LEFT SIDE: SHIPPING INFO -->
          <div class="col-md-6">
            <h4>Shipping Details</h4>
            <div class="mb-3">
              <label>Full Name</label>
              <input
                type="text"
                name="full_name"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input
                type="email"
                name="email"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label>Phone Number</label>
              <input
                type="text"
                name="phone_number"
                maxlength="10"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label>Address</label>
              <input
                type="text"
                name="address"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label>District</label>
              <input type="text" name="district" class="form-control" required />
            </div>
          </div>

          <!-- RIGHT SIDE: CART + PAYMENT -->
          <div class="col-md-6">
            <h4>Order Summary</h4>
            <div class="cart-summary mb-3">
              {% for product in cart_products %}
              <div class="d-flex justify-content-between">
                <span>{{ product.name }}</span>
                <span>x {{ quantities|get_item:product.id }}</span>
              </div>
              {% endfor %}
              <hr />
              <div class="d-flex justify-content-between fw-bold">
                <span>Total:</span>
                <span>NAD {{ totals }}</span>
              </div>
            </div>

            <h4>Payment Method</h4>

            <div class="payment-option mb-2">
              <label>
                <input
                  type="radio"
                  name="payment_option"
                  value="FNB eWallet"
                  required
                />
                💳 FNB eWallet — Send to <strong>081 849 3832</strong>
              </label>
            </div>

            <div class="payment-option mb-2">
              <label>
                <input
                  type="radio"
                  name="payment_option"
                  value="Bank Windhoek EasyWallet"
                />
                🏦 Bank Windhoek EasyWallet — Send to <strong>081 849 3832</strong>
              </label>
            </div>

            <div class="payment-option mb-2">
              <label>
                <input
                  type="radio"
                  name="payment_option"
                  value="Standard Bank PayPulse"
                />
                💰 Standard Bank PayPulse — Send to <strong>081 849 3832</strong>
              </label>
            </div>

            <div class="payment-option mb-3">
              <label>
                <input
                  type="radio"
                  name="payment_option"
                  value="Visa / Mastercard"
                />
                💳 Pay with Visa / Mastercard
              </label>
            </div>

            <button type="submit" class="btn btn-checkout mt-3">
              Confirm Order
            </button>
          </div>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
