{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{% static 'styles.css' %}" rel="stylesheet" />
    <title></title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Your Page Content -->
    <main class="flex-fill">
      <!-- Add your page content here -->
    </main>
    <!-- Footer -->
    <footer class="text-dark py-4 mt-auto">
      <div class="container">
        <div class="row text-center text-md-start align-items-center">
          <!-- About Link -->
          <div class="col-12 col-md-4 mb-3 mb-md-0">
            <a href="/info" class="text-dark text-decoration-underline fw-semibold">
              About Dyslexia
            </a>
          </div>

          <!-- Phone -->
          <div
            class="col-12 col-md-4 mb-3 mb-md-0 d-flex justify-content-center justify-content-md-start align-items-center"
          >
            <img
              src="{% static 'site/app.png' %}"
              alt="Phone Icon"
              class="me-2"
              style="width: 24px; height: 24px"
            />
            <span>+264 81 385 8181</span>
          </div>

          <!-- Email -->
          <div
            class="col-12 col-md-4 d-flex justify-content-center justify-content-md-start align-items-center"
          >
            <img
              src="{% static 'site/email.png' %}"
              alt="Email Icon"
              class="me-2"
              style="width: 24px; height: 24px"
            />
            <span>dyslexiacore@gmail.com</span>
          </div>
        </div>

        <hr class="border-secondary bg-dark mt-4" />
        <!-- Payment Section -->

        <div class="row">
          <div class="col text-center text-dark">
            © {{ now.year }} DyslexiaCore. All rights reserved.
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
