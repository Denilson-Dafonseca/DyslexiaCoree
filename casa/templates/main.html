{% extends "master.html" %} {% load static %}
<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="{% static 'Dyslexia_global.css' %}" />
  </head>
  <body>
    {% block content %}

    <nav class="navbar navbar-expand-lg bg-dark">
      <div class="container-fluid">
        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-item-start" href="{% url 'main' %}">
          <img
            src="{% static 'site/Dx.png' %}"
            alt="Dyslexia Logo"
            class="img-fluid"
            style="max-height: 80px"
          />
        </a>

        <div class="navbar-item align-item-center display-6 fw-bolder">
          DyslexiaCore
        </div>
        <a class="navbar-item d-flex align-item-end" href="{% url 'search' %}">
          <img
            src="{% static 'site/sea.jpg' %}"
            alt="Search"
            class="img-fluid"
          />
        </a>
      </div>
    </nav>

    {% include 'nav.html' %}

    <div class="container-fluid mb-3 mt-3">
      <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <!-- Indicators/dots -->
        <div class="carousel-indicators">
          {% for slide in slides %}
          <button
            type="button"
            data-bs-target="#demo"
            data-bs-slide-to="{{ forloop.counter0 }}"
            class="{% if forloop.first %}active{% endif %}"
          ></button>
          {% endfor %}
        </div>

        <!-- The slideshow/carousel -->
        <div class="carousel-inner">
          {% for slide in slides %}
          <div
            class="carousel-item text-center {% if forloop.first %}active{% endif %}"
          >
            <img
              src="{{ slide.image.url }}"
              class="d-block w-100 img-fluid"
              alt="{{ slide.title }}"
            />
            <div class="carousel-caption">
              <h3>{{ slide.title }}</h3>
              <p>{{ slide.caption }}</p>
            </div>
          </div>
          {% endfor %}
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#demo"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#demo"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    {% include 'footer.html' %} {% endblock %}

    <script>
      app.get("/fetch-secret", async (req, res) => {
        axios.get(`${process.env.BACKEND_URL}/secret`).then((response) => {
          res.json(response.data);
        });
      });
    </script>
  </body>
</html>
