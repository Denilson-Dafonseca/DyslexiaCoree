{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{% static 'styles.css' %}" rel="stylesheet" />
    <title></title>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- Your Page Content -->
    <main class="flex-fill">
      <!-- Add your page content here -->
    </main>

    <!-- Footer -->
    <footer class="text-white py-4 mt-auto bg-dark">
      <div class="container">
        <div class="row text-center text-md-start align-items-center">
          <!-- About Link -->
          <div class="col-12 col-md-4 mb-3 mb-md-0">
            <a href="/info" class="text-white text-decoration-none fw-semibold">
              About Dyslexia
            </a>
          </div>

          <!-- Phone -->
          <div
            class="col-12 col-md-4 mb-3 mb-md-0 d-flex justify-content-center justify-content-md-start align-items-center"
          >
            <img
              src="{% static 'site/app.png' %}"
              alt="Phone Icon"
              class="me-2"
              style="width: 24px; height: 24px"
            />
            <span>+264 81 385 8181</span>
          </div>

          <!-- Email -->
          <div
            class="col-12 col-md-4 d-flex justify-content-center justify-content-md-start align-items-center"
          >
            <img
              src="{% static 'site/email.png' %}"
              alt="Email Icon"
              class="me-2"
              style="width: 24px; height: 24px"
            />
            <span>dyslexiacore@gmail.com</span>
          </div>
        </div>

        <hr class="border-secondary bg-dark mt-4" />
        <div
          class="payment-options"
          style="text-align: center; padding: 20px 0; background-color: #f8f8f8"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg"
            alt="Visa"
            style="height: 30px; margin: 0 10px"
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Mastercard-logo.png"
            alt="MasterCard"
            style="height: 30px; margin: 0 10px"
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/3/30/American_Express_logo_%282018%29.svg"
            alt="Amex"
            style="height: 30px; margin: 0 10px"
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/5/50/PayPal.svg"
            alt="PayPal"
            style="height: 30px; margin: 0 10px"
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Apple_Pay_logo.svg"
            alt="Apple Pay"
            style="height: 30px; margin: 0 10px"
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Google_Pay_Logo.svg"
            alt="Google Pay"
            style="height: 30px; margin: 0 10px"
          />
        </div>

        <div class="row">
          <div class="col text-center text-light">
            © {{ now.year }} DyslexiaCore. All rights reserved.
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
