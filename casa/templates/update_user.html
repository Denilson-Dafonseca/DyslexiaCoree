{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="{% static 'bootstrap.bundle.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'Dyslexia_global.css' %}" />
    <link href="{% static 'styles.css' %}" rel="stylesheet" />
  </head>

  <body>
    {% block content %} {% if messages %} {% for message in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      {{ message }}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {% endfor %} {% endif %}

    <!-- Header-->
    <nav class="bg-dark py-2">
      <a class="d-flex" href="{% url 'main' %}">
        <img
          src="{% static 'site/Dx.png' %}"
          alt="Dyslexia Logo"
          class="img-fluid"
          style="max-height: 80px"
        />
      </a>
      <div class="container px-2 px-lg-5 my-2">
        <div class="text-center text-white">
          <h1 class="display-4 fw-bolder">Update User</h1>
          <p class="lead fw-normal text-white-50 mb-0">Update your account</p>
        </div>
      </div>
    </nav>

    <div class="container my-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <!-- Card for update form -->
          <div class="card shadow border rounded-3 p-4">
            <h3 class="text-center text-dark mb-4">Profile Information</h3>

            <form method="POST" action="{% url 'update_user' %}">
              {% csrf_token %} {{ user_form.as_p }}

              <!-- Submit button -->
              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-secondary">
                  Update Profile
                </button>
                <a href="{% url 'update_password' %}" class="btn btn-success"
                  >Update Password</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    {% endblock %} {% include 'footer.html' %}
  </body>
</html>
