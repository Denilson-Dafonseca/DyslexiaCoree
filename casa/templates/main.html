{% extends "master.html" %}
{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="{% static 'Dyslexia_global.css' %}" />

  </head>
  <body>
    {% block content %}


    <!-- Actual Content -->
    <div class="content">
      <nav class="navbar navbar-expand-lg bg-dark py-2 skeleton-item">
        <div class="container-fluid d-flex justify-content-between align-items-center flex-nowrap">
          <!-- Brand Logo -->
          <a class="navbar-brand d-flex align-items-center" href="{% url 'main' %}">
            <img src="{% static 'site/Dx.png' %}" alt="Dyslexia Logo" class="img-fluid" style="max-height: 60px; width: auto" />
          </a>

          <!-- Site Title -->
          <div class="text-dark fw-bolder text-center flex-grow-1 text-nowrap" style="font-size: clamp(1.2rem, 2.5vw, 2rem)">
            DyslexiaCore
          </div>

          <!-- Search Icon -->
          <a class="d-flex align-items-center justify-content-center" href="{% url 'search' %}">
            <img src="{% static 'site/seaa.png' %}" alt="Search" class="img-fluid" style="height: 55px; width: auto" />
          </a>
        </div>
      </nav>

      {% include 'nav.html' %}

 <div class="row">
  <div class="col-12 d-flex justify-content-center">
    <div class="text-dark fw-bolder text-center bg-white p-2">
      DyslexiaCore adverts area.
    </div>
  </div>
</div>     

      <div class="container-fluid mb-3 mt-3 skeleton-item">
        <div id="demo" class="carousel slide" data-bs-ride="carousel">
          <!-- Indicators/dots -->
          <div class="carousel-indicators">
            {% for slide in slides %}
            <button type="button" data-bs-target="#demo" data-bs-slide-to="{{ forloop.counter0 }}" class="{% if forloop.first %}active{% endif %}"></button>
            {% endfor %}
          </div>

          <!-- The slideshow/carousel -->
          <div class="carousel-inner">
            {% for slide in slides %}
            <div class="carousel-item text-center {% if forloop.first %}active{% endif %}">
              <img src="{{ slide.image.url }}" class="d-block w-100 img-fluid" alt="{{ slide.title }}" />
              <div class="carousel-caption">
                <h3>{{ slide.title }}</h3>
                <p>{{ slide.caption }}</p>
              </div>
            </div>
            {% endfor %}
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>

    {% include 'footer.html' %}
    {% endblock %}
  </body>
</html>
